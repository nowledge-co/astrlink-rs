[package]
name = "astrlink"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local AstrLink Guard inference in Rust"
license = "MIT"
repository = "https://github.com/nowledge-co/astrlink-rs"

[dependencies]
libm = "0.2"
prost = "0.14"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[profile.release]
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
